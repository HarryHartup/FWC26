name: Update Live Match Schedule

on:
  repository_dispatch:
    types: [update_schedule_data]

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Inject New Schedule Array
        # Setting the payload inside 'env' keeps Bash from trying to read the text as code execution lines
        env:
          MATCHES_DATA: ${{ github.event.client_payload.matches }}
        run: |
          python3 -c "
          import re, os
          
          # Grab the data safely directly out of the secure environment block
          new_data = os.environ.get('MATCHES_DATA')
          
          if not new_data:
              print('Critical Error: MATCHES_DATA environment variable is empty.')
              exit(1)
          
          with open('index.html', 'r') as f:
              content = f.read()
          
          # Clean regex substitution to target your match variables precisely
          updated = re.sub(r'(const matches\s*=\s*)\[[\s\S]*?\];', f'\g<1>{new_data};', content)
          
          with open('index.html', 'w') as f:
              f.write(updated)
          "

      - name: Commit and Push Changes Live
        run: |
          git config --global user.name "MCR Automated Update"
          git config --global user.email "actions@github.com"
          git commit -am "Update live schedule via MCR Admin Form"
          git push
